name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Falha rápido: erro de formatação ou de workflow em ~30s,
  #    sem gastar runner nos estágios seguintes.
  # ─────────────────────────────────────────────────────────────
  validacao:
    name: Validação
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Descritor Maven é válido
        run: mvn -B validate

      - name: Formatação do código (Spotless)
        run: mvn -B spotless:check

      - name: Sintaxe dos workflows (actionlint)
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  # ─────────────────────────────────────────────────────────────
  # 2. Compila e empacota. O .jar vira artefato baixável.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validacao
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compilar e empacotar
        run: mvn -B -DskipTests package

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: aplicacao-jar
          path: target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 3 a 5 rodam EM PARALELO depois do build.
  # ─────────────────────────────────────────────────────────────
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Executar testes
        run: mvn -B verify

      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "### 🧪 Testes"
            if [ -d target/surefire-reports ]; then
              total=$(grep -ho 'tests="[0-9]*"' target/surefire-reports/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
              falhas=$(grep -ho 'failures="[0-9]*"' target/surefire-reports/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
              erros=$(grep -ho 'errors="[0-9]*"' target/surefire-reports/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
              echo "| Total | Falhas | Erros |"
              echo "|---|---|---|"
              echo "| ${total:-0} | ${falhas:-0} | ${erros:-0} |"
            else
              echo "Nenhum relatório de teste encontrado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  analise:
    name: Análise estática
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: SpotBugs
        run: mvn -B spotbugs:check

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: CodeQL — inicializar
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: CodeQL — compilar
        run: mvn -B -DskipTests compile

      - name: CodeQL — analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java

  # ─────────────────────────────────────────────────────────────
  # 6. Quality gate: consome a cobertura produzida no estágio 3.
  # ─────────────────────────────────────────────────────────────
  qualidade:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: testes
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache do SonarCloud
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Recuperar cobertura do estágio 3
        uses: actions/download-artifact@v7
        with:
          name: cobertura
          path: target/

      - name: SonarCloud
        run: mvn -B -DskipTests package sonar:sonar

  # ─────────────────────────────────────────────────────────────
  # 7. Painel final: roda mesmo com estágio quebrado.
  # ─────────────────────────────────────────────────────────────
  resumo:
    name: Resumo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validacao, build, testes, analise, seguranca, qualidade]
    if: always()
    steps:
      - name: Montar painel
        run: |
          icone() { case "$1" in
            success) echo "✅ passou" ;;
            failure) echo "❌ falhou" ;;
            cancelled) echo "⚪ cancelado" ;;
            skipped) echo "⏭️ pulado" ;;
            *) echo "❔ $1" ;;
          esac; }
          {
            echo "## Pipeline · ${{ github.ref_name }}"
            echo ""
            echo "| Estágio | Resultado |"
            echo "|---------|-----------|"
            echo "| Validação (formato, workflows) | $(icone '${{ needs.validacao.result }}') |"
            echo "| Build e empacotamento | $(icone '${{ needs.build.result }}') |"
            echo "| Testes e cobertura | $(icone '${{ needs.testes.result }}') |"
            echo "| Análise estática (SpotBugs) | $(icone '${{ needs.analise.result }}') |"
            echo "| Segurança (CodeQL, dependências) | $(icone '${{ needs.seguranca.result }}') |"
            echo "| Quality gate (SonarCloud) | $(icone '${{ needs.qualidade.result }}') |"
            echo ""
            echo "Deploy sai quando a mensagem do commit em \`main\` contém \`#deployuat\`, ou por disparo manual."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reprovar se algum estágio falhou
        if: contains(needs.*.result, 'failure')
        run: |
          echo "Pelo menos um estágio falhou. Veja o painel acima."
          exit 1

  # ─────────────────────────────────────────────────────────────
  # 8. Imagem: constrói e publica o artefato de container.
  #    Este estágio deliberadamente NÃO sabe onde a imagem vai rodar.
  #    É o que permite trocar o destino de execução — Cloud Run hoje,
  #    Kubernetes depois — sem tocar em como a imagem é construída.
  # ─────────────────────────────────────────────────────────────
  imagem:
    name: Imagem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resumo
    # Sob demanda: só sai quando a mensagem do commit pede, ou por disparo manual.
    # Evita publicar a cada merge sem que ninguém tenha decidido publicar.
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && contains(github.event.head_commit.message, '#deployuat'))
        || github.event_name == 'workflow_dispatch'
      )
    environment: production

    permissions:
      contents: read
      # Necessário para o GitHub emitir o token OIDC que o Google valida.
      id-token: write

    outputs:
      referencia: ${{ steps.referencia.outputs.referencia }}

    env:
      # Registry e nome da imagem ficam separados do destino de execução: migrar para
      # ECR é cadastrar `IMAGE_REGISTRY`, não reescrever o job. Os defaults mantêm o
      # Artifact Registry atual funcionando sem cadastrar nada.
      REGISTRY: ${{ vars.IMAGE_REGISTRY || format('{0}-docker.pkg.dev/{1}/revende', vars.GCP_REGION, vars.GCP_PROJECT_ID) }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'revende-backend' }}

    steps:
      - uses: actions/checkout@v7

      # Troca o token OIDC do GitHub por credencial temporária do Google.
      # Não existe chave de service account em lugar nenhum.
      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar no registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # QEMU emula a arquitetura alvo. Aqui ele carrega pouco: o Dockerfile prende a
      # compilação ao `$BUILDPLATFORM`, então só o `adduser` do estágio de runtime roda
      # emulado — não o Maven inteiro.
      - name: QEMU para arquitetura cruzada
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      # arm64 entra agora porque descobrir a falta dele no dia da migração é caro:
      # nó Graviton (EKS) e Apple Silicon (máquina de dev) são arm64.
      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A referência sai como output do job para que o estágio 9 consuma a imagem
      # exata que foi publicada, em vez de remontar a string por conta própria.
      - name: Publicar referência da imagem
        id: referencia
        run: echo "referencia=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # 9. Deploy: leva a imagem do estágio 8 para o destino de execução.
  #    Tudo que é específico de Cloud Run mora aqui e só aqui — trocar
  #    por um `kubectl apply` é substituir este job, nada além dele.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: imagem
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      # Vem do estágio 8, não é remontada aqui: o que se publica é exatamente o que
      # foi construído, e a regra de nomeação da imagem vive num lugar só.
      IMAGEM: ${{ needs.imagem.outputs.referencia }}

    steps:
      # `--set-env-vars` substitui o valor no serviço. Com a variável vazia, o deploy
      # gravaria `CORS_ALLOWED_ORIGINS=` — e o Spring usaria a string vazia em vez do
      # default do application.yml, derrubando o CORS sem erro visível.
      - name: A origem do frontend está cadastrada?
        run: |
          if [ -z "${{ vars.CORS_ALLOWED_ORIGINS }}" ]; then
            echo "::error::Cadastre a variável CORS_ALLOWED_ORIGINS no repositório"
            echo "(Settings → Secrets and variables → Actions → Variables)."
            echo "Sem ela o deploy apagaria a origem do frontend em produção."
            exit 1
          fi

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # Os segredos vêm do Secret Manager direto para o container.
      # Nunca passam pelo GitHub, nunca aparecem em log, não entram na imagem.
      - name: Publicar no Cloud Run
        id: run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGEM }}
          flags: >-
            --allow-unauthenticated
            --service-account=revende-runtime@citric-proxy-506900-k8.iam.gserviceaccount.com
            --min-instances=0
            --max-instances=3
            --cpu=1
            --memory=1Gi
            --port=8080
            --set-secrets=DB_URL=revende-db-url:latest,DB_USER=revende-db-user:latest,DB_PASSWORD=revende-db-password:latest,REVENDE_JWT_SECRET=revende-jwt-secret:latest
            --set-env-vars=CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}

      - name: Registrar URL
        run: |
          {
            echo "### 🚀 Deploy concluído"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | ${{ steps.run.outputs.url }} |"
            echo "| Imagem | \`${{ env.IMAGEM }}\` |"
            echo "| Arquiteturas | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| Origem do frontend | ${{ vars.CORS_ALLOWED_ORIGINS }} |"
          } >> "$GITHUB_STEP_SUMMARY"
