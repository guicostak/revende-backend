name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Falha rápido: erro de formatação ou de workflow em ~30s,
  #    sem gastar runner nos estágios seguintes.
  # ─────────────────────────────────────────────────────────────
  validacao:
    name: Validação
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Descritor Maven é válido
        run: mvn -B validate

      - name: Formatação do código (Spotless)
        run: mvn -B spotless:check

      - name: Sintaxe dos workflows (actionlint)
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  # ─────────────────────────────────────────────────────────────
  # 2. Compila e empacota. O .jar vira artefato baixável.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validacao
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compilar e empacotar
        run: mvn -B -DskipTests package

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: aplicacao-jar
          path: target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 3 a 5 rodam EM PARALELO depois do build.
  # ─────────────────────────────────────────────────────────────
  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Executar testes
        run: mvn -B verify

      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "### 🧪 Testes"
            if [ -d target/surefire-reports ]; then
              total=$(grep -ho 'tests="[0-9]*"' target/surefire-reports/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
              falhas=$(grep -ho 'failures="[0-9]*"' target/surefire-reports/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
              erros=$(grep -ho 'errors="[0-9]*"' target/surefire-reports/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
              echo "| Total | Falhas | Erros |"
              echo "|---|---|---|"
              echo "| ${total:-0} | ${falhas:-0} | ${erros:-0} |"
            else
              echo "Nenhum relatório de teste encontrado."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  analise:
    name: Análise estática
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: SpotBugs
        run: mvn -B spotbugs:check

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: CodeQL — inicializar
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: CodeQL — compilar
        run: mvn -B -DskipTests compile

      - name: CodeQL — analisar
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java

  # ─────────────────────────────────────────────────────────────
  # 6. Quality gate: consome a cobertura produzida no estágio 3.
  # ─────────────────────────────────────────────────────────────
  qualidade:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: testes
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache do SonarCloud
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Recuperar cobertura do estágio 3
        uses: actions/download-artifact@v7
        with:
          name: cobertura
          path: target/

      - name: SonarCloud
        run: mvn -B -DskipTests package sonar:sonar

  # ─────────────────────────────────────────────────────────────
  # 7. Painel final: roda mesmo com estágio quebrado.
  # ─────────────────────────────────────────────────────────────
  resumo:
    name: Resumo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validacao, build, testes, analise, seguranca, qualidade]
    if: always()
    steps:
      - name: Montar painel
        run: |
          icone() { case "$1" in
            success) echo "✅ passou" ;;
            failure) echo "❌ falhou" ;;
            cancelled) echo "⚪ cancelado" ;;
            skipped) echo "⏭️ pulado" ;;
            *) echo "❔ $1" ;;
          esac; }
          {
            echo "## Pipeline · ${{ github.ref_name }}"
            echo ""
            echo "| Estágio | Resultado |"
            echo "|---------|-----------|"
            echo "| Validação (formato, workflows) | $(icone '${{ needs.validacao.result }}') |"
            echo "| Build e empacotamento | $(icone '${{ needs.build.result }}') |"
            echo "| Testes e cobertura | $(icone '${{ needs.testes.result }}') |"
            echo "| Análise estática (SpotBugs) | $(icone '${{ needs.analise.result }}') |"
            echo "| Segurança (CodeQL, dependências) | $(icone '${{ needs.seguranca.result }}') |"
            echo "| Quality gate (SonarCloud) | $(icone '${{ needs.qualidade.result }}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reprovar se algum estágio falhou
        if: contains(needs.*.result, 'failure')
        run: |
          echo "Pelo menos um estágio falhou. Veja o painel acima."
          exit 1

  # ─────────────────────────────────────────────────────────────
  # 8. Deploy. Só em push no main, e só depois de TODOS os estágios
  #    passarem. Autentica por OIDC: nenhum segredo do GCP no GitHub.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: resumo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production

    permissions:
      contents: read
      # Necessário para o GitHub emitir o token OIDC que o Google valida.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # Troca o token OIDC do GitHub por credencial temporária do Google.
      # Não existe chave de service account em lugar nenhum.
      - name: Autenticar no Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar no Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Construir e publicar imagem
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/revende/${{ vars.CLOUD_RUN_SERVICE }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Os segredos vêm do Secret Manager direto para o container.
      # Nunca passam pelo GitHub, nunca aparecem em log, não entram na imagem.
      - name: Publicar no Cloud Run
        id: run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/revende/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --service-account=revende-runtime@citric-proxy-506900-k8.iam.gserviceaccount.com
            --min-instances=0
            --max-instances=3
            --cpu=1
            --memory=1Gi
            --port=8080
            --set-secrets=DB_URL=revende-db-url:latest,DB_USER=revende-db-user:latest,DB_PASSWORD=revende-db-password:latest,REVENDE_JWT_SECRET=revende-jwt-secret:latest
            --set-env-vars=CORS_ALLOWED_ORIGINS=http://localhost:3000

      - name: Registrar URL
        run: |
          {
            echo "### 🚀 Deploy concluído"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | ${{ steps.run.outputs.url }} |"
            echo "| Imagem | \`${{ github.sha }}\` |"
            echo "| Região | ${{ vars.GCP_REGION }} |"
          } >> "$GITHUB_STEP_SUMMARY"
