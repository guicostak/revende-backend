name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, formatação, testes e Sonar
    runs-on: ubuntu-latest
    env:
      # Vazio até o secret existir. Os passos do Sonar se auto-desligam sem ele.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O Sonar precisa do histórico completo para atribuir código novo a cada autor
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Cache do SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: Formatação (Spotless)
        run: mvn -B spotless:check

      - name: Build e testes
        run: mvn -B verify

      - name: Análise estática (SpotBugs)
        run: mvn -B spotbugs:check

      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        run: mvn -B sonar:sonar

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7
