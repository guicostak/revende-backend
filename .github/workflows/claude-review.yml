name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Revisão contra o contrato do projeto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Sem o secret, o job não roda — a CI continua verde antes da configuração.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude
        if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revise este pull request contra o contrato do próprio projeto, que está
            em CLAUDE.md na raiz. Ele é a régua: arquitetura hexagonal (§1), padrões
            de código (§2) e checklist de fechamento (§3).

            A base de conhecimento de domínio está em docs/. Antes de comentar sobre
            comportamento, leia a regra de negócio afetada em docs/Regras/ e o caso
            de uso em docs/Casos de Uso/.

            Priorize, nesta ordem:
            1. Import de framework dentro de domain/ — é a violação que a arquitetura
               inteira existe para impedir.
            2. Regra de negócio implementada no service em vez do agregado.
            3. Status HTTP errado no caminho de erro, principalmente 400 onde deveria
               ser 403 ou 409.
            4. Consulta nova sem paginação, ou que introduz N+1.
            5. Segredo, credencial ou dado pessoal em código, log ou configuração.
            6. Comportamento alterado sem a nota correspondente em docs/ atualizada
               no mesmo PR.

            Seja específico: cite arquivo e linha, e explique a consequência real, não
            a regra abstrata. Se o PR contradiz uma regra documentada, diga qual —
            pode ser mudança de negócio disfarçada de correção.

            Não comente formatação: Spotless já reprova isso na CI. Não elogie por
            elogiar. Se estiver tudo certo, diga isso em uma linha.
