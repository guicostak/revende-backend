version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
      qualidade:
        patterns: ["com.diffplug.spotless*", "org.jacoco*", "com.github.spotbugs*", "org.sonarsource*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
