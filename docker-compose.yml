services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: revende
      POSTGRES_USER: revende
      POSTGRES_PASSWORD: revende
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 mudou o ponto de montagem: /var/lib/postgresql, não .../data
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revende -d revende"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/revende
      DB_USER: revende
      DB_PASSWORD: revende
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Em produção isto vem do gerenciador de segredos, nunca daqui.
      REVENDE_JWT_SECRET: dev-only-nao-use-em-producao-troque-por-env-var-32bytes+
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
