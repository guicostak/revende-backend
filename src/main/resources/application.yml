spring:
  application:
    name: revende-backend

  # Tudo por variável de ambiente. Os defaults servem ao docker-compose local.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/revende}
    username: ${DB_USER:revende}
    password: ${DB_PASSWORD:revende}

  jpa:
    hibernate:
      # O schema é do Flyway. O Hibernate apenas confere.
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Cloud Run e afins injetam PORT.
  port: ${PORT:8080}
  # Termina requisição em andamento antes de morrer. Sem isso, todo deploy corta conexão.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

revende:
  jwt:
    secret: ${REVENDE_JWT_SECRET:dev-only-nao-use-em-producao-troque-por-env-var-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Lista separada por vírgula. Em produção, o domínio real do front.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
